twoDistinctCauses:
- id: C1
  what: L'initialisation n'a jamais tourne.
  why: Les Jobs rendus par Tutor sont des GABARITS VIDES — ni commande ni variables. Tutor pose la commande
    a l'execution. Flux deploie les charges mais NE PEUT PAS initialiser la plateforme.
  classification: PAS un defaut. L'etape figure dans la liste d'operations de l'adaptateur AKS sous le
    nom `approved-migration-job`. Prevue au plan, jamais lancee.
  structuralLesson: Sur cette plateforme, le declaratif s'arrete au deploiement. L'initialisation est
    imperative par conception de Tutor.
- id: C2
  what: J'ai confondu deux secrets distincts.
  why: GG_MYSQL_PASSWORD etait cable sur mysql-root-password, mais ce champ alimente le mot de passe du
    compte APPLICATIF openedx. root administre le serveur ; openedx est le compte de Django.
  classification: MON ERREUR de cablage, ni un defaut du produit ni une contrainte d'Azure.
  fix: Variable renommee GG_MYSQL_OPENEDX_PASSWORD, alimentee par un secret propre. Greffon, 4 patches
    et SecretProviderClass alignes.
defectCaughtBeforeExecution:
  what: Mon script d'initialisation lisait GG_MYSQL_OPENEDX_PASSWORD dans le pod MySQL, qui ne portait
    que le mot de passe root.
  consequence: La variable aurait ete vide et le compte applicatif serait ne SANS MOT DE PASSE.
  howCaught: Verification du contenu reel des variables au build kustomize, avant toute execution.
  fix: Le patch mysql expose desormais cette variable depuis le Secret projete.
